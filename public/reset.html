<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Reset password – ATS Resume Checker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="auth">
  <div style="text-align:center;margin-bottom:12px"><span class="logo" aria-hidden="true" style="display:inline-grid"><svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h9l5 5v15H9z"/><path d="M18 6v5h5"/><path d="M12.5 19l2.6 2.6L20 16.5"/></svg></span></div>
  <h1>ATS Resume Checker</h1>
  <p class="sub">Choose a new password.</p>
  <form id="form" class="card" novalidate>
    <label for="password">New password</label>
    <input id="password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirm">Confirm new password</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
    <button id="go" type="submit">Update password</button>
    <p id="error" class="error" role="alert" hidden></p>
    <p id="ok" class="notice" role="status" hidden>Password updated. <a href="/login.html">Sign in</a></p>
  </form>
</main>
<script src="reset.js"></script>
</body>
</html>

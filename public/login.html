<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – ATS Resume Checker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="auth">
  <div style="text-align:center;margin-bottom:12px"><span class="logo" aria-hidden="true" style="display:inline-grid"><svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h9l5 5v15H9z"/><path d="M18 6v5h5"/><path d="M12.5 19l2.6 2.6L20 16.5"/></svg></span></div>
  <h1>ATS Resume Checker</h1>
  <p class="sub">Sign in to check your resume against a job description.</p>
  <form id="form" class="card" novalidate>
    <div class="tabs">
      <button type="button" id="tabIn" class="on">Sign in</button>
      <button type="button" id="tabUp">Create account</button>
    </div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" minlength="8" required>
    <button id="go" type="submit">Sign in</button>
    <p id="error" class="error" role="alert" hidden></p>
    <p class="forgot" id="forgotWrap"><a href="#" id="forgot">Forgot password?</a></p>
  </form>

  <form id="forgotForm" class="card" novalidate hidden>
    <h2>Reset your password</h2>
    <p class="muted">Enter your account email and we'll send you a reset link.</p>
    <label for="fEmail">Email</label>
    <input id="fEmail" type="email" autocomplete="email" required>
    <button id="fGo" type="submit">Send reset link</button>
    <p id="fMsg" class="notice" role="status" hidden></p>
    <p id="fErr" class="error" role="alert" hidden></p>
    <p class="forgot"><a href="#" id="back">Back to sign in</a></p>
  </form>
</main>
<script src="login.js"></script>
</body>
</html>
